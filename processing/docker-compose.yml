services:
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # one-shot job: create the warehouse bucket
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin password &&
      mc mb --ignore-existing local/warehouse &&
      echo 'warehouse bucket ready'
      "

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    restart: unless-stopped
    ports:
      - "8181:8181"

  spark:
    build: .
    container_name: spark-master
    depends_on:
      - iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - spark-checkpoints:/opt/spark/checkpoints
    ports:
      - "4040:4040"   # Spark UI of the running application
    # keep the container alive; all Spark applications are submitted into THIS container only
    entrypoint: ["/bin/bash", "-c", "tail -f /dev/null"]
    restart: unless-stopped

volumes:
  minio-data:
  spark-checkpoints:

networks:
  default:
    name: lakehouse
    external: true
